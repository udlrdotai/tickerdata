name: Publish versioned JSON release

on:
  push:
    tags: ['data-*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed default-branch ancestor
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run validate && npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-json
          path: dist/latest/*.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-json
          path: release
      - name: Create a release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.json \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Reviewed metadata snapshot. Check manifest.json for schema, data version, source commit and SHA-256 hashes. Do not move this tag or replace its assets."
