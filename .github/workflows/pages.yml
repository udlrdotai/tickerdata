name: Publish Pages (explicit opt-in)

on:
  workflow_dispatch:
    inputs:
      confirm_public:
        description: 'I have reviewed site visibility and consent to publishing all source records, notes and vocabularies.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm_public == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require repository opt-in
        run: node -e "const c=require('./config/site.json'); if(c.pages_enabled !== true || !c.repository_url) { console.error('Set pages_enabled and repository_url only after visibility review.'); process.exit(1); }"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run validate && npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
